services:
  redis:
    image: redis:7-alpine
    container_name: smartmoney-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NOTE: app/.env already points REDIS_STREAM_URL / REDIS_RESULT_URL at an
  # external Redis Cloud instance, so that's what api/worker will use as-is.
  # The redis service above is bundled so you can switch to a local queue by
  # setting REDIS_STREAM_URL=redis://redis:6379/0 and
  # REDIS_RESULT_URL=redis://redis:6379/1 in .env instead.
  api:
    build: .
    image: smartmoney-ai:latest
    container_name: smartmoney-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/openapi.json"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: smartmoney-ai:latest
    container_name: smartmoney-worker
    restart: unless-stopped
    command: ["python", "-m", "app.services.worker"]
    env_file:
      - .env
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  hf_cache:
